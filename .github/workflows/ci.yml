name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.13"]
        include:
          # Python 3.9 is the oldest supported version; newer runner images no longer ship it.
          - os: ubuntu-22.04
            python: "3.9"
          - os: macos-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install .
      - name: Python tests (CLI, providers, docs)
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Language tests
        run: medha test tests
