# Publishes the package to PyPI using trusted publishing (no API token stored here).
# One-time setup on pypi.org: add this repository and workflow file as a trusted
# publisher for the project "medha". Then run this workflow from the Actions tab.
name: Publish to PyPI

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
